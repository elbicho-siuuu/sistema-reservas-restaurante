[project]
name = "trabajo-eval-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elbicho-siuuu", email = "vicente.rodriguezm@correoaiep.cl" }
]
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
trabajo-eval-1 = "trabajo_eval_1.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    # 🎭 Agregamos Playwright para las pruebas de extremo a extremo
    "pytest-playwright>=0.5.0",
]
